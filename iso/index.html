    ctx.beginPath();ctx.moveTo(X-6,Y-10);ctx.lineTo(X,Y-2);ctx.lineTo(X+6,Y-10);ctx.fill();ctx.fillStyle='#3a2408';ds2.forEach((t,i)=>ctx.fillText(t,X,Y-h-2+i*16+8));ctx.globalAlpha=1}
  // dòng chữ to giữa màn
  if(banner){const p=banner.T/banner.d,s=p<.12?1.6-p*5:1;ctx.save();ctx.translate(W/2,H*(banner.nho?.2:.3));ctx.scale(s,s);ctx.globalAlpha=p>.75?(1-p)/.25:1;
    let fs=banner.nho?30:42;ctx.font=`800 ${fs}px "Baloo 2",sans-serif`;const bw=ctx.measureText(banner.t).width;if(bw>W*.86){fs*=W*.86/bw;ctx.font=`800 ${fs}px "Baloo 2",sans-serif`}ctx.lineWidth=7;ctx.strokeStyle='#160a02';ctx.strokeText(banner.t,0,0);ctx.shadowColor=banner.c;ctx.shadowBlur=24;ctx.fillStyle=banner.c;ctx.fillText(banner.t,0,0);ctx.restore()}
  if(lienHoan>=5){ctx.font='800 20px "Baloo 2",sans-serif';ctx.textAlign='right';ctx.lineWidth=5;ctx.strokeStyle='#160a02';const t='LIÊN HOÀN x'+lienHoan;ctx.strokeText(t,W-140,H*.42);ctx.fillStyle='#ffb04a';ctx.fillText(t,W-140,H*.42);ctx.textAlign='center'}
  if(flash>0){ctx.fillStyle=`rgba(${flashC},${flash*.35})`;ctx.fillRect(0,0,W,H)}

  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

}
function boDong(t,w){ctx.font='600 13px "Baloo 2",sans-serif';const tu=t.split(' '),ds=[];let d='';for(const x of tu){if(ctx.measureText(d+' '+x).width>w&&d){ds.push(d);d=x}else d=d?d+' '+x:x}ds.push(d);return ds}
const mm=$('mm'),mc=mm.getContext('2d');
function veBanDo(){mc.setTransform(1,0,0,1,0,0);mc.clearRect(0,0,236,236);const k=236/MAPW/1.45,P=(x,y)=>[118+(x-y)*k*.707*1.0,118+(x+y-MAPW)*k*.707*.5+0];
  mc.save();mc.translate(0,0);mc.fillStyle='rgba(40,70,40,.55)';mc.beginPath();for(const [x,y] of [[0,0],[MAPW,0],[MAPW,MAPW],[0,MAPW]]){const [a,b]=P(x,y);mc.lineTo(a,b)}mc.fill();
  const cham=(x,y,c,r)=>{const [a,b]=P(x,y);mc.fillStyle=c;mc.beginPath();mc.arc(a,b,r,0,7);mc.fill()};
  for(const l of den)cham(l.x,l.y,'#ff9a4a',3);for(const o of roi)if(o.k==='do')cham(o.cx??o.x,o.cy??o.y,RAR[o.t].c,3);
  for(const q of quai)if(!q.chet)cham(q.x,q.y,q.trum?'#ff3a3a':'#ff7a6a',q.trum?7:3);cham(hero.x,hero.y,'#fff',5);mc.restore()}

  banner={t:'RỪNG TRÚC · ĐÊM',c:'#cfe8b8',d:2.6,T:0};setTimeout(()=>noi('Ta là Kim Quy. Theo ta gom lại các mảnh bảo khí nào! Kéo tay để đi, còn không cứ để ngươi tự đánh.'),1200)}
