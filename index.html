<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}body{margin:0;user-select:none;-webkit-user-select:none}[hidden]{display:none!important}</style>
<title>Người Que Săn Đồ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Bố cục theo game mẫu: một màn hình điện thoại đứng. Trên: thanh nhân vật + tài nguyên, hàng biểu tượng.
   Giữa: trận đánh (cột phải chế độ chơi, góc dưới phải kỹ năng). Dưới: máu, nhật ký, thanh 5 nút.
   Cửa sổ mở đè lên: nền giấy da, dải tiêu đề đỏ, nút X đỏ giữa đáy. Một giao diện cố định (không đổi sáng/tối). */
:root{
  --wood:#24160d; --wood2:#3f2716; --wood3:#6b4527; --edge:#a87a45;
  --parch:#f3e2bd; --parch2:#e7d09f; --parch3:#cfae73; --ink:#3b2814; --ink2:#7a5a36;
  --gold:#f6c64f; --red:#c63b2f; --green:#5c9e2e; --blue:#2e78b8; --gem:#8fe3ff; --hp:#d8433a;
  --f-disp:"Baloo 2","Segoe UI",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--wood);color:var(--parch)}
body{font-family:var(--f-body);font-size:14px;line-height:1.4;overflow:hidden;
  background:repeating-linear-gradient(90deg,#24160d 0 46px,#2a1a10 46px 48px);
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{cursor:default;filter:grayscale(.6);opacity:.6}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.game{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--wood2);box-shadow:0 0 0 2px #120a05,0 0 40px rgba(0,0,0,.6)}

/* thanh trên */
.top{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;padding:8px 10px 6px;background:linear-gradient(180deg,#4a2f1b,#3a2414);border-bottom:2px solid #1b0f07}
.ava{grid-row:1/span 2;width:56px;height:56px;border-radius:10px;border:2px solid var(--edge);background:#2b1d2e;position:relative;display:grid;place-items:center}
.ava{--kc:#888;overflow:hidden;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--kc) 55%,#fff) 0,color-mix(in srgb,var(--kc) 60%,#000) 80%)}
.ava canvas{display:block}
.ava b{position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);font-family:var(--f-disp);font-size:12px;line-height:16px;background:#1b0f07;border:1px solid var(--edge);border-radius:8px;padding:0 6px;white-space:nowrap;color:var(--gold)}
.row1{display:flex;gap:6px;min-width:0}
.namebox{flex:1;min-width:0;background:var(--parch);color:var(--ink);border:2px solid var(--edge);border-radius:8px;padding:1px 8px;line-height:1.15}
.namebox b{display:block;font-family:var(--f-disp);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.namebox span{font-family:var(--f-disp);font-weight:700;color:var(--red);font-size:13px;font-variant-numeric:tabular-nums}
.mapbox{flex:1;min-width:0;background:#2c3b4c;border:2px solid #557089;border-radius:8px;padding:2px 8px;font-size:12px;line-height:1.2;color:#dbe7f2}
.mapbox b{display:block;font-family:var(--f-disp);font-size:13px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res{display:flex;gap:6px}
.pill{flex:1;display:flex;align-items:center;gap:5px;background:#1b0f07;border:1px solid #6b4527;border-radius:20px;padding:1px 8px 1px 3px;font-family:var(--f-disp);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:0}
.pill i{width:16px;height:16px;border-radius:50%;flex:none}
.pill.g i{background:radial-gradient(circle at 35% 35%,#ffe9a0,#e0a020)}
.pill.m i{background:radial-gradient(circle at 35% 35%,#e6f9ff,#4bb6e6);border-radius:4px;transform:rotate(45deg) scale(.8)}
.pill.d i{background:radial-gradient(circle at 35% 35%,#e7e2f0,#8c84a3);border-radius:3px}

/* hàng biểu tượng */
.icons{display:flex;gap:4px;padding:6px 8px 4px;overflow-x:auto;scrollbar-width:none}
.ic{position:relative;flex:1 0 50px;display:grid;justify-items:center;gap:0;font-family:var(--f-disp);font-weight:800;font-size:11.5px;line-height:1.1;color:#fff;
  text-shadow:1px 1px 0 #2b1609,-1px -1px 0 #2b1609,1px -1px 0 #2b1609,-1px 1px 0 #2b1609,0 2px 2px #000}
.ic .o{width:42px;height:42px;display:grid;place-items:center;transition:transform .12s}
.ic:active .o{transform:scale(.9)}
svg.gi{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 0 rgba(0,0,0,.45))}
.bump{animation:bump .35s ease-out}
@keyframes bump{40%{transform:scale(1.18)}}
.dot{position:absolute;top:-2px;right:6px;width:14px;height:14px;border-radius:50%;background:var(--red);border:2px solid #fff;font-size:9px;line-height:10px;text-align:center;color:#fff}
.lock{position:absolute;top:-3px;right:-2px;font-size:9px;font-weight:700;background:#3a3a44;color:#ddd;border-radius:6px;padding:0 4px;line-height:14px;text-shadow:none;border:1px solid #777}

/* trận đánh */
.arena{position:relative;flex:1;min-height:200px;overflow:hidden;border-block:2px solid #1b0f07}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.side{position:absolute;right:6px;top:8px;display:grid;gap:8px;z-index:2}
.side .ic{flex:none;width:56px}
.side .o{width:46px;height:46px;border-radius:50%;padding:6px;background:radial-gradient(circle at 50% 35%,#4a7aa8,#1a2e44 75%);border:2px solid #e0b060;box-shadow:0 2px 0 #0008,inset 0 0 8px #0008}
.afk{position:absolute;left:6px;bottom:8px;z-index:2}
.afk .ic{width:54px}
.afk .o{width:44px;height:44px;border-radius:50%;padding:6px;background:radial-gradient(circle at 50% 35%,#8a6a3a,#3a2410 75%);border:2px solid #e0b060;box-shadow:0 2px 0 #0008}
.skills{position:absolute;right:8px;bottom:16px;display:flex;align-items:flex-end;gap:8px;z-index:2}
.sk{--kc:#888;--p:0;position:relative;width:54px;height:54px;border-radius:50%;border:3px solid #e0b060;
  background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--kc) 70%,#fff),color-mix(in srgb,var(--kc) 45%,#000) 70%,#120a05);
  box-shadow:0 3px 0 #0009,0 0 0 2px #2b1609;display:grid;place-items:center;padding:9px}
.sk:not(.cd){animation:ready 1.6s ease-in-out infinite}
@keyframes ready{50%{box-shadow:0 3px 0 #0009,0 0 0 2px #2b1609,0 0 14px var(--kc)}}
.sk.big{width:66px;height:66px;padding:11px}
.sk::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.68) calc(var(--p)*360deg),transparent 0)}
.sk em{position:absolute;inset:0;display:grid;place-items:center;z-index:1;font-style:normal;font-family:var(--f-disp);font-weight:800;font-size:19px;color:#fff;pointer-events:none;
  text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
.sk span{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);z-index:2;white-space:nowrap;font-family:var(--f-disp);font-weight:800;font-size:10px;line-height:14px;color:#fff;
  background:#1b0f07e0;border:1px solid #e0b060;border-radius:7px;padding:0 5px}
.autosk{width:40px;height:40px;border-radius:50%;border:2px solid #777;background:#1b0f07;font-family:var(--f-disp);font-weight:800;font-size:10px;line-height:1;color:#aaa}
.autosk[aria-pressed="true"]{border-color:var(--green);color:#b6f08a}
.hint{position:absolute;left:8px;top:8px;font-size:11px;color:rgba(255,255,255,.55);z-index:1;pointer-events:none}

/* dưới trận đánh */
.hud{padding:6px 10px;display:grid;gap:5px;background:#2b1b0f}
.bar{position:relative;height:16px;border-radius:8px;background:#120a05;border:1px solid #000;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(180deg,#f06a5e,var(--hp))}
.bar.st i{background:linear-gradient(180deg,#f8d77a,#c9902a)}
.bar span{position:absolute;inset:0;text-align:center;font-family:var(--f-disp);font-weight:700;font-size:11px;line-height:15px;color:#fff;text-shadow:0 1px 1px #000;font-variant-numeric:tabular-nums}
.log{background:rgba(0,0,0,.35);border-radius:6px;padding:3px 8px;display:grid;gap:1px;font-size:12px;min-height:38px}
.log p{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log b{font-family:var(--f-disp);font-size:11px;background:#5a3a22;border-radius:3px;padding:0 4px;margin-right:6px;color:var(--gold)}

.nav{display:grid;grid-template-columns:repeat(5,1fr);background:linear-gradient(180deg,#4a2f1b,#2e1c0f);border-top:2px solid #1b0f07;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav .ic{flex:none;font-size:12px}
.nav .o{width:46px;height:46px;margin-top:-14px}
.nav .ic[aria-current="true"] .o{transform:translateY(-3px) scale(1.08);filter:drop-shadow(0 0 8px #ffd34d)}
.nav .ic[aria-current="true"]{color:#ffe08a}

/* cửa sổ */
.win{position:fixed;inset:0;z-index:20;display:flex;justify-content:center;background:rgba(10,5,2,.55)}
.frame{position:relative;width:100%;max-width:480px;margin-top:calc(70px + env(safe-area-inset-top,0px));margin-bottom:calc(70px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;padding:0 10px}
.ribbon{align-self:center;position:relative;z-index:2;margin-bottom:-16px;background:linear-gradient(180deg,#e05346,#a62a20);border:2px solid #f0b37a;border-radius:6px;
  padding:2px 28px;font-family:var(--f-disp);font-weight:800;font-size:20px;color:#fff;text-shadow:0 2px 0 #6e140d;box-shadow:0 3px 0 #6e140d}
.paper{flex:1;min-height:0;overflow:auto;background:var(--parch);color:var(--ink);border:4px solid var(--wood3);border-radius:12px;box-shadow:inset 0 0 0 2px var(--parch3),0 8px 30px rgba(0,0,0,.6);
  padding:24px 12px 40px;display:grid;gap:12px;align-content:start}
.paper>*,.sec>*{min-width:0}
.expbar{grid-column:1/-1;position:relative;height:12px;margin:4px 6px 0;border-radius:6px;background:#120a05;border:1px solid #000;overflow:hidden}
.expbar i{display:block;height:100%;background:linear-gradient(180deg,#9be36a,#4f9a1f)}
.expbar span{position:absolute;inset:0;text-align:center;font-family:var(--f-disp);font-weight:700;font-size:10px;line-height:11px;color:#fff;text-shadow:0 1px 1px #000;font-variant-numeric:tabular-nums}
.leave{position:absolute;left:8px;top:8px;z-index:3;background:#1b0f07cc;border:2px solid #ff8a80;border-radius:8px;padding:2px 10px;font-family:var(--f-disp);font-weight:800;font-size:13px;color:#ffb3ab}
.bl{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;background:var(--parch2);border-radius:8px;padding:8px}
.bl .face{width:52px;height:52px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:22px;color:#fff;border:2px solid #0004;text-shadow:0 1px 2px #000}
.bl h4{margin:0;font-family:var(--f-disp);font-size:16px;line-height:1.15}
.bl p{margin:0;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.bl .btn{padding:6px 10px;font-size:14px;min-width:84px}
.bl.me{background:#ffe9b8;border:2px solid #e0a020}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums;font-size:14px}
.kv span{color:var(--ink2)} .kv b{font-family:var(--f-disp);text-align:right}
.x{position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);z-index:3;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff7a6a,#b8261b);border:3px solid #fff3d6;
  box-shadow:0 3px 0 #6e140d;color:#fff;display:grid;place-items:center}
.x svg{width:26px;height:26px;stroke-width:3.4}
.sec{display:grid;gap:8px}
.sec>h3{margin:0;font-family:var(--f-disp);font-size:15px;line-height:1.2;color:var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  background:var(--parch2);border-radius:6px;padding:2px 10px}
.sec>h3 span{font-family:var(--f-body);font-size:11px;font-weight:500;color:var(--ink2)}
.muted{color:var(--ink2);font-size:12px;margin:0}
.btn{border-radius:8px;padding:8px 12px;font-family:var(--f-disp);font-weight:800;font-size:15px;line-height:1.15;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.5);
  background:linear-gradient(180deg,#8bc24a,var(--green));border:2px solid #2f5a12;box-shadow:0 3px 0 #2f5a12}
.btn.blue{background:linear-gradient(180deg,#5aa6e6,var(--blue));border-color:#174a78;box-shadow:0 3px 0 #174a78}
.btn.orange{background:linear-gradient(180deg,#ffb54d,#e07b12);border-color:#8a4507;box-shadow:0 3px 0 #8a4507}
.btn.grey{background:linear-gradient(180deg,#b9b0a0,#8c8273);border-color:#5b5348;box-shadow:0 3px 0 #5b5348}
.btn small{display:block;font-family:var(--f-body);font-weight:600;font-size:11px;text-shadow:none;opacity:.92}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ô đồ: nền màu theo bậc như game mẫu */
.cell{--rc:#888;position:relative;width:100%;aspect-ratio:1;border-radius:8px;border:2px solid color-mix(in srgb,var(--rc) 60%,#000);
  background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 85%,#fff),color-mix(in srgb,var(--rc) 70%,#000));display:grid;place-items:center;color:#fff}
.cell svg.it{width:74%;height:74%;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.cell.empty svg.it{filter:grayscale(1);opacity:.3}
.cell .lv{position:absolute;right:3px;bottom:0;font-family:var(--f-disp);font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 1px #000}
.cell .pl{position:absolute;right:3px;top:0;font-family:var(--f-disp);font-size:12px;font-weight:800;color:#fff36a;text-shadow:0 1px 1px #000}
.cell .set{position:absolute;left:2px;top:2px;font-family:var(--f-disp);font-size:9px;font-weight:800;background:#000a;color:#ffd0d0;border-radius:3px;padding:0 3px;line-height:13px}
.cell.empty{border:2px dashed var(--parch3);background:var(--parch2);color:var(--parch3)}
.cell::before{content:"";position:absolute;inset:2px 2px 55% 2px;border-radius:6px 6px 40% 40%;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0));pointer-events:none}
.cell.empty::before{display:none}
.cell.gone{filter:grayscale(1);opacity:.45}
.cell.sel{outline:3px solid var(--gold);outline-offset:1px}
.cell.t6{animation:redpulse 1.6s ease-in-out infinite}
@keyframes redpulse{0%,100%{box-shadow:0 0 4px rgba(255,61,61,.5)}50%{box-shadow:0 0 14px rgba(255,61,61,1)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}

/* cửa sổ nhân vật: 3 ô trái, người ở giữa, 3 ô phải */
.doll{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;align-items:center;background:linear-gradient(180deg,#5a4030,#3a2818);border-radius:10px;padding:10px;border:2px solid var(--wood3)}
.doll .colm{display:grid;gap:10px}
.doll .slot{display:grid;gap:2px;justify-items:center;font-size:11px;color:#f3e2bd}
.doll .mid{display:grid;justify-items:center;gap:4px;color:#fff}
.doll .cp{font-family:var(--f-disp);font-weight:800;font-size:22px;color:var(--gold);text-shadow:0 2px 0 #000}
.doll .mid canvas{display:block}
.doll .cn{font-family:var(--f-disp);font-weight:700;font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;font-variant-numeric:tabular-nums}
.stats div{display:flex;justify-content:space-between;padding:4px 2px;border-bottom:1px dashed var(--parch3)}
.stats span{color:var(--ink2)} .stats b{font-family:var(--f-disp)}
.setline{font-size:12px;color:var(--ink2);margin:0}
.setline .on{color:#b3261b;font-weight:600}

.clsrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cls{--kc:#888;background:var(--parch2);border:2px solid var(--parch3);border-radius:8px;padding:8px;text-align:left;display:grid;gap:2px;color:var(--ink)}
.cls b{font-family:var(--f-disp);font-size:16px;color:color-mix(in srgb,var(--kc) 70%,#000)}
.cls span{font-size:11px;color:var(--ink2);line-height:1.3}
.cls[aria-pressed="true"]{border-color:color-mix(in srgb,var(--kc) 70%,#000);background:color-mix(in srgb,var(--kc) 22%,var(--parch))}
.cls ul{margin:4px 0 0;padding-left:16px;font-size:12px;display:grid;gap:2px}
.skrow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;background:var(--parch2);border-radius:8px;padding:8px}
.skrow .sk{width:52px;height:52px;padding:8px;animation:none}
.skrow .sk::after{display:none}
.skrow h4{margin:0;font-family:var(--f-disp);font-size:15px}
.skrow p{margin:0;font-size:12px;color:var(--ink2)}
.skrow em{font-style:normal;font-family:var(--f-disp);font-weight:700;color:var(--ink2);font-size:13px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--parch2);border-radius:8px;padding:8px 10px}

.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chk{display:flex;align-items:center;gap:8px;background:var(--parch2);border-radius:6px;padding:6px 8px;font-family:var(--f-disp);font-weight:700;font-size:14px;color:color-mix(in srgb,var(--rc) 72%,#000);text-align:left}
.chk i{width:20px;height:20px;border-radius:4px;border:2px solid var(--ink2);background:#fff8;display:grid;place-items:center;flex:none;font-style:normal;color:#fff;font-size:14px;line-height:1}
.chk[aria-pressed="true"] i{background:var(--green);border-color:#2f5a12}
.chk[aria-pressed="true"] i::before{content:"✓"}
.enh{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;background:var(--parch2);border-radius:8px;padding:10px}
.enh h4{margin:0;font-family:var(--f-disp);font-size:16px}
.enh p{margin:0;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.enh .big{font-family:var(--f-disp);font-weight:800;font-size:20px;color:var(--ink)}

/* cầu nguyện */
.altar{position:relative;aspect-ratio:1/0.82;border-radius:10px;overflow:hidden;border:2px solid var(--wood3);
  background:radial-gradient(circle at 50% 46%,#6a3f9a 0,#2a1a46 45%,#120b22 80%)}
.altar::before{content:"";position:absolute;inset:0;background:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 85% 60%,#fff,transparent),radial-gradient(1px 1px at 30% 75%,#fff,transparent),radial-gradient(1px 1px at 55% 85%,#fff,transparent);opacity:.7}
.orb{position:absolute;width:15%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #f6c64f;
  background:radial-gradient(circle at 35% 30%,#fff9,var(--rc) 45%,color-mix(in srgb,var(--rc) 50%,#000));box-shadow:0 0 12px var(--rc)}
.orb.c{width:30%;border-width:3px;background:radial-gradient(circle at 35% 30%,#fff,#c79bff 35%,#5a2a9a);box-shadow:0 0 30px #b46cff;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translate(-50%,-56%)}}
.altar .note{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:12px;color:#fff;text-shadow:0 1px 2px #000;font-weight:600}
.altar .note b{color:#ff6b6b;font-family:var(--f-disp);font-size:15px}
.meter{height:10px;border-radius:5px;background:#0003;overflow:hidden;border:1px solid #0003}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#c4382c,#ff6b5b)}
.meter.okm i{background:linear-gradient(90deg,#4f8f23,#8bc24a)}
.meter.gm i{background:linear-gradient(90deg,#c9902a,#f8d77a)}
.odds{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.odds th{font-weight:600;color:var(--ink2);text-align:right;padding:4px 0;font-size:12px}
.odds th:first-child,.odds td:first-child{text-align:left}
.odds td{padding:4px 0;text-align:right;border-top:1px dashed var(--parch3)}
.odds td:first-child b{font-family:var(--f-disp);color:color-mix(in srgb,var(--rc) 72%,#000)}
.odds td:first-child i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--rc);margin-right:8px;vertical-align:-1px;border:1px solid #0004}
.sets{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (max-width:400px){.sets{grid-template-columns:1fr}}
.sets div{background:var(--parch2);border-radius:8px;padding:8px 10px;font-size:12px}
.sets h4{margin:0 0 4px;font-family:var(--f-disp);font-size:15px;color:#b3261b}
.sets ul{margin:0;padding-left:16px;color:var(--ink2);display:grid;gap:2px}

/* nhiệm vụ */
.actbox{background:var(--parch2);border-radius:10px;padding:10px;display:grid;gap:8px}
.actbox .meter{height:14px;margin:0 6px}
.chests{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chests button{background:#fff6;border:2px solid var(--parch3);border-radius:8px;padding:4px 2px;font-size:11px;line-height:1.2;color:var(--ink2)}
.chests button b{display:block;font-family:var(--f-disp);font-size:16px;color:var(--ink)}
.chests button.ready{border-color:#e07b12;background:#ffe2a8;color:#8a4507;animation:shake 1.2s ease-in-out infinite}
.chests button.done{opacity:.5}
@keyframes shake{0%,100%{transform:none}10%{transform:rotate(-4deg)}20%{transform:rotate(4deg)}30%{transform:none}}
.q{display:grid;grid-template-columns:40px 1fr auto;gap:4px 10px;align-items:center;background:var(--parch2);border-radius:8px;padding:8px}
.q .qi{grid-row:1/span 2;width:40px;height:40px;display:grid;place-items:center}
.q h4{margin:0;font-size:14px;font-weight:600}
.q .meter{grid-column:2}
.q .btn{grid-row:1/span 2;grid-column:3;padding:6px 10px;font-size:14px;min-width:70px}
.q p{margin:0;font-size:11px;color:var(--ink2);grid-column:2;font-variant-numeric:tabular-nums}
.done-stamp{grid-row:1/span 2;grid-column:3;font-family:var(--f-disp);font-weight:800;color:var(--green);border:2px solid var(--green);border-radius:50%;padding:10px 4px;font-size:11px;transform:rotate(-12deg)}

/* bảng chi tiết món đồ (trượt từ dưới) */
.sheet{position:fixed;inset:0;background:rgba(10,5,2,.6);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.pane{--rc:#888;width:100%;max-width:480px;max-height:88%;overflow:auto;background:var(--parch);color:var(--ink);border:4px solid var(--wood3);border-bottom:0;
  border-radius:14px 14px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
.pane .top2{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}
.pane h3{margin:0;font-family:var(--f-disp);font-size:21px;line-height:1.1;color:color-mix(in srgb,var(--rc) 70%,#000);text-wrap:balance}
.pane h3 em{font-style:normal;color:#c47a00}
.pane .meta{font-size:12px;color:var(--ink2);margin-top:3px}
.mainst{margin:12px 0 6px;font-family:var(--f-disp);font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.mainst span{color:var(--ink2);font-family:var(--f-body);font-size:12px;font-weight:500;margin-left:6px}
.aff{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-variant-numeric:tabular-nums}
.aff li{display:flex;gap:8px;align-items:center}
.aff li::before{content:"";width:8px;height:8px;transform:rotate(45deg);background:var(--rc);border:1px solid #0005;flex:none}
.aff .hi{color:#a86200;font-weight:600}
.aff .none{color:var(--ink2)} .aff .none::before{background:var(--parch3)}
.box{margin-top:10px;background:var(--parch2);border-radius:8px;padding:8px 10px;font-size:13px;display:grid;gap:3px;font-variant-numeric:tabular-nums}
.box h4{margin:0;font-family:var(--f-disp);font-size:15px}
.box.set h4{color:#b3261b}
.box p{margin:0;color:var(--ink2)}
.box p.on{color:var(--ink);font-weight:600} .box p.on::before{content:"✓ ";color:var(--green)}
.cmp{margin-top:10px;font-size:13px;font-variant-numeric:tabular-nums}
.up{color:#2f7a12;font-weight:700}.down{color:#b3261b;font-weight:700}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.res{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}

.toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;
  background:#1b0f07ee;border:2px solid var(--tc,var(--gold));border-radius:10px;color:#fff;
  padding:7px 14px;font-weight:600;font-size:13px;max-width:min(92vw,440px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
/* nhiệm vụ chính góc trên trận đánh */
.mq{position:absolute;left:6px;top:6px;z-index:2;max-width:60%;text-align:left;background:#1b0f07d8;border:2px solid #e0b060;border-radius:8px;padding:3px 8px;font-size:12px;line-height:1.3;color:#fff}
.mq b{display:block;font-family:var(--f-disp);font-size:11px;color:var(--gold)}
.mq i{font-style:normal;color:#9be36a;font-weight:700;font-variant-numeric:tabular-nums}
.mq em{display:block;font-style:normal;color:#8fe3ff;font-size:11px}
.mq.ok{border-color:#9be36a;animation:ready2 1s ease-in-out infinite}
.mq.ok b{color:#9be36a}
.mapbox{cursor:pointer}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tabs button{position:relative;padding:6px 4px;font-size:14px}
.tabs .dot{top:-6px;right:-4px}
/* điểm danh */
.sign{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.sign div{position:relative;background:var(--parch2);border:2px solid var(--parch3);border-radius:8px;padding:3px 2px;text-align:center;font-size:10px;line-height:1.2;color:var(--ink2);min-height:52px;display:grid;align-content:center}
.sign div b{display:block;font-family:var(--f-disp);font-size:12px;color:var(--ink)}
.sign div.big{background:#ffe9b8;border-color:#e0a020}
.sign div.got{opacity:.45}
.sign div.got::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-size:26px;color:var(--green);font-weight:800}
.sign div.now{border-color:#e07b12;box-shadow:0 0 0 2px #ffb54d;animation:ready2 1.2s ease-in-out infinite}
/* bản đồ */
.regs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.regs button{flex:none;border-radius:6px;padding:4px 8px;font-family:var(--f-disp);font-weight:700;font-size:13px;background:var(--parch2);border:2px solid var(--parch3);color:var(--ink)}
.regs button[aria-pressed="true"]{background:var(--blue);border-color:#174a78;color:#fff}
.regs button:disabled{opacity:.45}
.nodes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.node{border-radius:10px;padding:6px 2px;background:linear-gradient(180deg,#8bc24a,var(--green));border:2px solid #2f5a12;color:#fff;font-family:var(--f-disp);font-weight:800;font-size:14px;line-height:1.1;text-shadow:0 1px 0 #0008;display:grid;gap:2px}
.node small{font-size:11px;color:#ffe14d;letter-spacing:-1px}
.node.cur{background:linear-gradient(180deg,#ffb54d,#e07b12);border-color:#8a4507;box-shadow:0 0 0 3px #ffe08a}
.node.rb{background:linear-gradient(180deg,#ff7a6a,#c63b2f);border-color:#6e140d}
.node:disabled{background:#b9b0a0;border-color:#8c8273;color:#eee}
.hub{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;background:var(--parch2);border-radius:8px;padding:8px}
.hub .o{width:48px;height:48px}
.hub h4{margin:0;font-family:var(--f-disp);font-size:16px;line-height:1.15}
.hub p{margin:0;font-size:12px;color:var(--ink2)}
.hub .btn{padding:6px 10px;font-size:14px;min-width:72px}
i.gem{display:inline-block;width:12px;height:12px;transform:rotate(45deg) scale(.85);border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid #0006;
  background:radial-gradient(circle at 35% 30%,#fff,var(--gc) 55%,color-mix(in srgb,var(--gc) 50%,#000))}
.bl canvas{display:block;width:52px;height:52px;border-radius:10px;background:radial-gradient(circle at 50% 40%,#fff6e0,#e7d09f)}
/* màn mở đầu */
.intro{position:fixed;inset:0;z-index:60;display:flex;justify-content:center;background:#120a05}
.intro .in{position:relative;width:100%;max-width:480px;height:100%;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:0 18px calc(28px + env(safe-area-inset-bottom,0px))}
.intro canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.intro .logo{position:absolute;top:calc(9% + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-family:var(--f-disp);font-weight:800;line-height:.95;color:#ffe08a;
  font-size:clamp(40px,13vw,60px);text-shadow:0 4px 0 #7a2a0a,0 0 2px #2b1609,3px 3px 0 #2b1609,-3px -3px 0 #2b1609,3px -3px 0 #2b1609,-3px 3px 0 #2b1609,0 10px 24px rgba(0,0,0,.6)}
.intro .logo small{display:block;font-size:.38em;color:#fff;letter-spacing:.06em;margin-top:8px;text-shadow:0 2px 0 #2b1609,2px 2px 0 #2b1609,-2px -2px 0 #2b1609}
.intro .box2{position:relative;z-index:2;width:100%;background:var(--parch);color:var(--ink);border:4px solid var(--wood3);border-radius:14px;padding:14px;display:grid;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.intro .box2 h3{margin:0;font-family:var(--f-disp);font-size:18px;text-align:center}
.intro input{font:inherit;font-family:var(--f-disp);font-size:18px;font-weight:700;color:var(--ink);background:#fff8e6;border:2px solid var(--parch3);border-radius:8px;padding:8px 10px;width:100%}
.intro .go{font-size:22px;padding:12px;animation:ready2 1.4s ease-in-out infinite}
@keyframes ready2{50%{transform:scale(1.04)}}
.intro .tap{position:relative;z-index:2;font-family:var(--f-disp);font-weight:800;font-size:20px;color:#fff;text-shadow:0 2px 0 #000;animation:blink 1.4s ease-in-out infinite;margin-bottom:10px}
@keyframes blink{50%{opacity:.35}}
.intro .ver{position:absolute;right:10px;bottom:calc(6px + env(safe-area-inset-bottom,0px));font-size:10px;color:#fff8;z-index:2}

/* hướng dẫn lần đầu: vòng sáng quanh nút + bàn tay chỉ + khung lời */
.tutr{position:fixed;z-index:50;border-radius:14px;pointer-events:none;border:3px solid #ffe14d;box-shadow:0 0 0 4px #0006,0 0 22px #ffe14d;animation:tutp 1s ease-in-out infinite}
@keyframes tutp{50%{transform:scale(1.08)}}
.tuth{position:fixed;z-index:51;width:44px;height:44px;pointer-events:none;animation:tuth .9s ease-in-out infinite}
@keyframes tuth{50%{transform:translate(-6px,-8px)}}
.tutb{position:fixed;left:50%;transform:translateX(-50%);z-index:52;width:min(92vw,440px);background:#fff8e6;color:var(--ink);border:3px solid #e0a020;border-radius:12px;
  padding:8px 12px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.55);font-weight:600;font-size:14px}
.tutb b{font-family:var(--f-disp);color:#b3261b}
.tutb button{font-size:11px;color:var(--ink2);text-decoration:underline}

/* cài đặt */
.set2{display:grid;gap:6px}
.set2 .toggle{font-weight:600}
.seg{display:flex;gap:4px}
.seg button{border-radius:6px;padding:4px 10px;font-family:var(--f-disp);font-weight:800;background:#fff8;border:2px solid var(--parch3);color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--green);border-color:#2f5a12;color:#fff}
.code{width:100%;min-height:64px;font:12px/1.3 ui-monospace,Consolas,monospace;color:var(--ink);background:#fff8e6;border:2px solid var(--parch3);border-radius:8px;padding:6px;word-break:break-all;resize:vertical}
.btn.red{background:linear-gradient(180deg,#ff7a6a,#c63b2f);border-color:#6e140d;box-shadow:0 3px 0 #6e140d}

/* so sánh đồ */
.cmpt{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;margin-top:6px}
.cmpt th{font-weight:600;color:var(--ink2);font-size:11px;text-align:right;padding:2px 0}
.cmpt th:first-child,.cmpt td:first-child{text-align:left}
.cmpt td{text-align:right;padding:3px 0;border-top:1px dashed var(--parch3)}
.cmpt td:last-child{width:62px}
.cell .ua{position:absolute;left:2px;bottom:1px;font-size:13px;font-weight:800;color:#5dff4a;text-shadow:0 0 2px #000,0 1px 1px #000;line-height:1}
@media (prefers-reduced-motion:reduce){.cell.t6,.orb.c,.chests button.ready,.sk,.intro .go,.tutr,.tuth{animation:none}}
</style>

<script>
const RAR=[
  {n:'Trắng',c:'#a9a9b2',w:40,lines:0,m:.6,q:'Sắt'},
  {n:'Lục',c:'#4fb85f',w:25,lines:1,m:.85,q:'Đồng'},
  {n:'Xanh',c:'#3d8ee6',w:16,lines:2,m:1.1,q:'Bạc'},

  {n:'Cam',c:'#f08a1c',w:5,lines:4,m:1.85,q:'Hoàng Kim'},
  {n:'Hồng',c:'#f0559e',w:3,lines:5,m:2.3,q:'Thiên Hồ'},
  {n:'Đỏ',c:'#e8322f',w:1,lines:6,m:2.9,q:''},
];
const PRAY_W=[30,26,20,14,6.5,2.5,1], PITY=100, SALV=[1,2,4,8,16,32,64], BAG_MAX=40;
const REGIONS=['Làng Tre','Rừng Trúc','Đầm Sương','Hang Đá Vôi','Núi Lửa','Thành Cổ','Ma Giới'];
const SLOTS=[
  {n:'Vũ khí',b:['Kiếm','Đao','Thương'],main:'atk',mv:6},
  {n:'Mũ',b:['Mũ','Mão'],main:'hp',mv:30},
  {n:'Áo',b:['Giáp','Áo'],main:'def',mv:4},
  {n:'Găng',b:['Găng','Hộ Thủ'],main:'atk',mv:3},
  {n:'Giày',b:['Giày','Hài'],main:'spd',mv:4},
  {n:'Nhẫn',b:['Nhẫn','Bội'],main:'crit',mv:2},
];
const ST={
  atk:{n:'Công',p:0,v:3}, def:{n:'Thủ',p:0,v:2}, hp:{n:'Máu',p:0,v:15},
  crit:{n:'Chí mạng',p:1,v:1.2}, cdmg:{n:'ST chí mạng',p:1,v:6}, spd:{n:'Tốc đánh',p:1,v:2.5},
  ls:{n:'Hút máu',p:1,v:.8}, gold:{n:'Vàng nhận',p:1,v:5}, find:{n:'Tìm đồ hiếm',p:1,v:3},
};
const SETS={
  long:{n:'Huyết Long',ab:'HL',pieces:['Huyết Long Kiếm','Huyết Long Mão','Huyết Long Giáp','Huyết Long Trảo','Huyết Long Hài','Huyết Long Giới'],
    b:[[2,'+15% Công',s=>{s.atkP+=15}],[4,'+20% Chí mạng',s=>{s.crit+=20}],[6,'25% đòn đánh gọi Long Hống, gây 300% sát thương',s=>{s.dragon=1}]]},
  quy:{n:'Thiết Quy',ab:'TQ',pieces:['Thiết Quy Chùy','Thiết Quy Khôi','Thiết Quy Giáp','Thiết Quy Thủ','Thiết Quy Hài','Thiết Quy Hoàn'],

function makeItem(t,lvl,si,sk){
  if(si==null)si=rnd(6);
  const S=SLOTS[si],r=RAR[t],mp=ST[S.main].p;
  const sc=mp?1+.02*lvl:1+.12*lvl;
  let main=S.mv*sc*r.m*(.9+Math.random()*.2); main=mp?Math.round(main*10)/10:Math.max(1,Math.round(main));
  const pool=Object.keys(ST).filter(k=>k!==S.main).sort(()=>Math.random()-.5).slice(0,r.lines);
  const aff=pool.map(k=>rollAff(k,lvl,t));
  let name;
  const bases=si===0?cls().wpn:S.b;
  if(t===6){if(!sk){const ks=Object.keys(SETS);sk=ks[rnd(ks.length)]}name=si===0?SET_WPN[sk][G.cls||'cb']:SETS[sk].pieces[si]}
  else name=bases[rnd(bases.length)]+' '+r.q;
  return {id:++G.uid,t,lvl,si,main,aff,sk:t===6?sk:null,name,plus:0,so:Array(nSock(t)).fill(null)};
}
// một dòng phụ: [chỉ số, giá trị, gần tối đa]
function rollAff(k,lvl,t){const s=ST[k],lo=t===6?.85:.55,q=lo+Math.random()*(1-lo);let v=s.v*(s.p?1:1+.1*lvl)*(.8+t*.3)*q;
  v=s.p?Math.round(v*10)/10:Math.max(1,Math.round(v));return [k,v,q>.95?1:0]}
// ô khảm linh thạch: Tím, Cam 1 ô · Hồng 2 ô · Đỏ 3 ô
const nSock=t=>t>=6?3:t>=5?2:t>=3?1:0;
const sockOf=it=>{if(!it.so||it.so.length<nSock(it.t))it.so=(it.so||[]).concat(Array(nSock(it.t)).fill(null)).slice(0,nSock(it.t));return it.so};
// cường hóa: mỗi cấp +10% chỉ số chính
function mainVal(it){const v=it.main*(1+.1*(it.plus||0));return ST[SLOTS[it.si].main].p?Math.round(v*10)/10:Math.round(v)}
const enhRate=p=>p<5?100:[90,80,70,60,50,40,35,30,25,20][p-5];

function calc(eq){
  const s={...cls().base,ls:0,gold:0,find:0,atkP:0,defP:0,hpP:0,dragon:0,dr:0,skP:0,cdr:0,dbl:0};
  const L=(G.lv||1)-1,gr=GROW[G.cls||'cb'];s.atk+=L*gr.atk;s.def+=L*gr.def;s.hp+=L*gr.hp;
  const sets={};
  for(const it of eq)if(it){s[SLOTS[it.si].main]+=mainVal(it);for(const [k,v] of it.aff)s[k]+=v;if(it.sk)sets[it.sk]=(sets[it.sk]||0)+1;
    for(const g of it.so||[])if(g){const [k,l]=g.split(':');s[LT[k].st]+=ltVal(k,+l)}}
  for(const R of RELICS){const v=relVal(R);if(v)s[R.st]+=v}
  const P=G.pet&&PETS.find(x=>x.k===G.pet.act);if(P&&G.pet.own[P.k])s[P.st]+=petVal(P,G.pet.own[P.k]);
  for(const k in sets)for(const [n,,f] of SETS[k].b)if(sets[k]>=n)f(s);
  s.atk=Math.round(s.atk*(1+s.atkP/100));s.def=Math.round(s.def*(1+s.defP/100));s.hp=Math.round(s.hp*(1+s.hpP/100));
  s.crit=Math.min(s.crit,100);s.dr=Math.min(s.dr,60);s.cdr=Math.min(s.cdr,50);
  s.power=Math.round(s.atk*(1+s.crit/100*(s.cdmg/100-1))*(1+s.spd/100)*(s.dragon?1.5:1)*(1+s.dbl/200)*(1+s.skP/400)*(1+s.cdr/200)*4+s.def*3+s.hp*.4+s.ls*20+s.dr*15);
  s.sets=sets;return s;
}
function rollTier(w,boss){
  const find=(S?S.find:0)/100;
  const ws=w.map((x,i)=>x*(1+find*i*.3)*(boss&&i>=3?3:1));
  let r=Math.random()*ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<ws.length;i++){r-=ws[i];if(r<=0)return i}
  return 0;
}

function give(r){
  const out=[];
  if(r.gem){G.gem+=r.gem;out.push(r.gem+' ngọc')}
  if(r.da){G.da+=r.da;out.push(r.da+' đá')}
  if(r.gold){G.gold+=r.gold;out.push(nf(r.gold)+' vàng')}
  if(r.lt){for(let i=0;i<r.lt;i++)ltAdd(ltRand(),r.ltl||1);out.push(r.lt+' linh thạch cấp '+(r.ltl||1))}
  if(r.sh){const R=relShard(r.sh);out.push(r.sh+' mảnh '+R.n)}
  if(r.shu){G.relU=(G.relU||0)+r.shu;out.push(r.shu+' mảnh vạn năng')}
  if(r.trum){daily().trum=Math.max(0,daily().trum-r.trum);out.push('+'+r.trum+' lượt ải trùm')}
  if(r.pvp){daily().pvp=Math.max(0,daily().pvp-r.pvp);out.push('+'+r.pvp+' lượt đấu trường')}
  if(r.item!=null){const t=rollTier(r.item>=6?[0,0,0,0,0,0,1]:r.item>=5?[0,0,0,0,0,80,20]:[0,0,0,0,60,30,10]);const it=makeItem(t,G.stage);addBag(it);out.push('1 món '+RAR[t].n+': '+it.name)}
  return out.join(', ');
}

  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.008);g.gain.exponentialRampToValueAtTime(.001,t0+dur);o.connect(g);g.connect(dest);o.start(t0);o.stop(t0+dur+.02)}

  g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);s.connect(f);f.connect(g);g.connect(sfxG);s.start(t0,Math.random()*.25);s.stop(t0+dur+.02)}

const MAJ={ch:[[0,4,7],[9,12,16],[5,9,12],[7,11,14]],sc:[0,2,4,7,9,12,14,16],root:48};
const MIN={ch:[[0,3,7],[-4,0,3],[3,7,10],[-2,2,5]],sc:[0,3,5,7,10,12,15,17],root:45};
function music(){
  if(!AC||!G.set.mus||document.hidden)return;
  const K=fight||curReg()>=3?MIN:MAJ,st=60/(fight?124:86)/2;
  if(musNext<AC.currentTime)musNext=AC.currentTime+.05;
  while(musNext<AC.currentTime+.35){const ch=K.ch[Math.floor(musI/8)%4],b=musI%8;
    if(b%4===0)tone(mf(K.root+ch[0]-12),musNext,st*3.5,'triangle',.5,null,musG);
    if(b%2===1)tone(mf(K.root+ch[1+(b>>2&1)]),musNext,st*1.2,'triangle',.16,null,musG);
    if(Math.random()<.6){melo=Math.max(0,Math.min(K.sc.length-1,melo+rnd(3)-1));tone(mf(K.root+12+K.sc[melo]),musNext,st*1.6,'sine',.2,null,musG)}
    musNext+=st;musI++}
}

  let d=S.atk*mult*(hero.war>0?1.4:1)*(o.basic||o.pet||o.nocrit||o.tap?1:1+S.skP/100),crit=!o.nocrit&&(o.crit||Math.random()*100<S.crit),kind=o.nocrit?'burn':mult>=2||o.c?'skill':'dmg';
  if(crit){d*=S.cdmg/100;kind='crit'}
  if(S.dragon&&o.basic&&Math.random()<.25){d*=3;kind='dragon'}

  d*=100/(100+(mon.def||0))*(mon.shield>0?.5:1);

/* ---------- treo máy: tắt game vẫn đánh ở ải đang đứng, 70% tốc độ, tối đa 12 giờ ---------- */
function afkRate(){
  const hp=40*1.2**(G.stage-1),dps=S.atk*(1+S.crit/100*(S.cdmg/100-1))*(1+S.spd/100)*1.3;
  const kph=3600/(hp/dps+.5)*.7;
  return {kph,gold:kph*8*1.12**G.stage*(1+S.gold/100),exp:kph*expKill(false),items:kph*.55,gem:kph*.12};
}
function offline(){
  const now=Date.now(),away=(now-(G.lastSeen||now))/1000;G.lastSeen=now;
  if(away<60)return;
  const secs=Math.min(away,AFK_MAX*3600),h=secs/3600,R=afkRate();
  const kills=Math.floor(R.kph*h),gold=Math.round(R.gold*h),exp=Math.round(R.exp*h),gem=Math.round(R.gem*h);
  const n=Math.min(80,Math.round(R.items*h)),kept=[];let da=0,salv=0;
  for(let i=0;i<n;i++){const t=rollTier(RAR.map(r=>r.w)),it=makeItem(t,G.stage);if(G.auto[t]){da+=SALV[t];salv++}else kept.push(it)}
  const lv0=G.lv;
  G.gold+=gold;G.gem+=gem;G.da+=da;gainExp(exp,1);kept.forEach(addBag);prog('kill',kills);prog('salv',salv);
  const tm=s=>{const hh=Math.floor(s/3600),mm=Math.floor(s%3600/60);return (hh?hh+' giờ ':'')+mm+' phút'};
  open={afk:1};
  const pn=$('pane');pn.style.setProperty('--rc','#c47a00');kept.sort((a,b)=>b.t-a.t);
  pn.innerHTML=`<h3>Thưởng treo máy</h3><div class="meta">Bạn vắng ${tm(away)}${away>secs?' (tính tối đa '+AFK_MAX+' giờ)':''}. Nhân vật vẫn đánh ở ải ${G.stage}.</div>
    <div class="kv" style="margin-top:12px"><span>Quái đã hạ</span><b>${nf(kills)}</b><span>Vàng</span><b>+${nf(gold)}</b><span>Kinh nghiệm</span><b>+${nf(exp)}${G.lv>lv0?' · Lv '+lv0+' → '+G.lv:''}</b>
    <span>Ngọc</span><b>+${nf(gem)}</b><span>Đồ nhận</span><b>${kept.length} món</b><span>Tự phân giải</span><b>${salv} món → +${da} đá</b></div>
    ${kept.length?`<div class="res">${kept.slice(0,10).map(it=>cell(it,`data-bag="${it.id}"`)).join('')}</div>`:''}
    <div class="btns"><button class="btn" data-act="close">Nhận</button><button class="btn blue" data-open="tui">Xem túi đồ</button></div>`;
  $('sheet').hidden=false;dirty=1;save();
}
/* ---------- kỹ năng ---------- */
let cds=[0,0,0],timers=[],vfx=[],parts=[],amb=[],banners=[],shake=0,scroll=0,flashC='255,40,40';
const later=(t,fn)=>timers.push({t,fn});
// FIG: cỡ nhân vật so với khung đánh (game mẫu: nhân vật cao ~1/4 khung). ENTER: giây quái mới đi vào
const FIG=.44,ENTER=.5;
const U=()=>Math.min(H/100,W/80)*FIG;
const HX=()=>W*(G.cls==='cb'?.3:.24);
const GY=()=>H*.74;
const MX=()=>W*.64;
const handPt=()=>[HX()+12*U(),GY()-28*U()];
const monK=()=>mon.pvp?1:mon.big?1.9:mon.boss?1.4:1;
function monX(){const u=U();return MX()+(mon.enter>0?mon.enter/ENTER*W*.55:0)+(mon.hit>0?mon.hit/.12*5*u:0)-(mon.lunge>0?Math.sin(mon.lunge/.22*Math.PI)*9*u:0)}
function monTop(){const u=U();if(mon.pvp)return GY()-56*u;const sp=MT[mon.ty],s=u*monK();return GY()-((sp.fly||0)+sp.h)*s}
// chỗ đặt thanh máu quái (trên vương miện nếu là trùm) và chỗ hiện số sát thương
function barY(){const u=U();return monTop()-((mon.boss&&!mon.pvp?10.5*monK():0)+9)*u}
function monMid(){const u=U();if(mon.pvp)return [monX(),GY()-26*u];const sp=MT[mon.ty],s=u*monK();return [monX(),GY()-((sp.fly||0)+sp.h*.5)*s]}
function shoot(k,c){const [x,y]=handPt(),[tx,ty]=monMid();vfx.push({ty:'proj',k:k||(G.cls==='ps'?'magic':'arrow'),t:0,life:.16,x,y,tx,tY:ty,c:c||(G.cls==='ps'?'#9fc0ff':'#ffffff')})}
const SK={
  xoay(){hero.atk=0;later(.08,()=>{const [x,y]=monMid();vfx.push({ty:'whirl',t:0,life:.45,x,y,c:'#ffd2a0'});shake=Math.max(shake,4);hit(2.5)})},
  het(){hero.war=6;vfx.push({ty:'shout',t:0,life:.6,c:'#f6c64f'});burst(HX(),GY()-26*U(),20,'#f6c64f',{sp:160,g:-60})},
  tram(){hero.atk=0;hero.lunge=.25;later(.1,()=>{const [x,y]=monMid();vfx.push({ty:'bigslash',t:0,life:.5,x,y,c:'#ff3d3d'});sfx('boom');flash=.3;flashC='255,40,40';shake=10;hit(6);if(mon&&!mon.dead)mon.stun=2})},
  doi(){hero.atk=0;shoot();later(.16,()=>hit(1.4));later(.15,()=>{hero.atk=0;shoot()});later(.31,()=>hit(1.4))},
  mua(){vfx.push({ty:'skyglow',t:0,life:2.3,c:'#c8ffc8'});for(let i=0;i<8;i++)later(i*.25,()=>{const [x]=monMid();vfx.push({ty:'rain',t:0,life:.2,x:x+(Math.random()-.5)*34*U(),c:'#e8ffe0'});later(.2,()=>hit(.6))})},
  xuyen(){hero.atk=0;later(.12,()=>{vfx.push({ty:'beam',t:0,life:.4,c:'#9bff9b'});shake=6;hit(5,{crit:1})})},
  lua(){hero.atk=0;shoot('fire','#ff9a33');later(.16,()=>{const [x,y]=monMid();burst(x,y,18,'#ff9a33',{sp:170});vfx.push({ty:'ring',t:0,life:.35,x,y,c:'#ffb04d'});hit(2.2,{c:'#ffa64d'});if(mon&&!mon.dead){mon.burn=3;mon.bt=0}})},
  bang(){hero.shield=5;burst(HX(),GY()-25*U(),16,'#8fe3ff',{sp:120,g:-40})},
  loi(){vfx.push({ty:'bolt',t:0,life:.45,seed:Math.random()*1e3,c:'#fff3a0'});later(.05,()=>{sfx('boom');flash=.25;flashC='255,250,200';shake=10;const [x,y]=monMid();burst(x,y,22,'#fff3a0',{sp:220});hit(8,{c:'#fff3a0'})})},
};
function cast(i){
  const k=cls().sk[i];
  if(cds[i]>0||!mon||mon.dead||mon.enter>0)return false;
  cds[i]=k.cd*(1-S.cdr/100);sfx('skill');SK[k.k]();say(HX(),GY()-80*U(),k.n,cls().c,17,'name');return true;
}
function kill(){
  mon.dead=.001;sfx('kill');
  const [x,y]=monMid(),u=U(),top=barY();
  burst(x,y,mon.boss?36:18,mon.col||'#ffffff',{sp:mon.boss?230:150,s:3.4});
  burst(x,y,8,'#ffffff',{k:'smoke',sp:60,g:-20,life:.6,s:7});
  vfx.push({ty:'ring',t:0,life:.4,x,y,c:'#ffffff'});
  coins(x,y,mon.boss?12:4);
  const g=Math.round(8*1.12**G.stage*(1+S.gold/100)*(mon.boss?5:1));
  G.gold+=g;say(x,top-10*u,'+'+nf(g),null,14,'gold');
  if(mon.boss){const gm=mon.rb?40:15;G.gem+=gm;say(x,top-24*u,'+'+gm+' ngọc',null,14,'gem')}
  if(mon.rb){give({lt:1,ltl:1,sh:2});say(x,top-52*u,'+Linh thạch +Mảnh bảo vật',null,13,'gem')}
  else if(Math.random()<.02){ltAdd(ltRand(),1);say(x,top-38*u,'+1 linh thạch',null,13,'gem')}
  else if(Math.random()<.06){G.gem+=2;say(x,top-24*u,'+2 ngọc',null,13,'gem')}
  const ex=expKill(mon.boss);say(HX(),GY()-76*u,'KN +'+nf(ex),null,13,'exp');gainExp(ex);
  const n=mon.rb?3:mon.boss?2:(Math.random()<.55?1:0);
  for(let i=0;i<n;i++){let t=rollTier(RAR.map(r=>r.w),mon.boss);if(mon.rb&&i===0)t=Math.max(4,t);drop(t,x+(i-(n-1)/2)*26*u)}
  prog('kill');
  if(mon.boss){prog('boss');const r0=curReg(),f=hero.hp/hero.max,st=f>.7?3:f>.4?2:1;
    G.stars[G.stage]=Math.max(G.stars[G.stage]||0,st);say(x,top-38*u,'★'.repeat(st)+'☆'.repeat(3-st),null,18,'gold');
    G.stage++;G.kill=0;G.best=Math.max(G.best,G.stage);toast('Hạ trùm! Lên ải '+G.stage,'#f6c64f');log('Ải','Hạ trùm, lên ải '+G.stage,'#ffd34d');
    if(curReg()!==r0)later(.6,()=>banner(REGIONS[curReg()],'Vùng mới · ải '+G.stage,'#ffd34d',2.4))}
  else G.kill++;
  dirty=1;save();
}
// đồ mới: bậc đang bật "Tự phân giải" thì thành đá ngay
function drop(t,x){
  const it=makeItem(t,G.stage);
  fx.push({x,t:0,tier:t,si:it.si,n:it.name});
  if(t===6){prog('red');sfx('red');vib([80,40,200]);flash=.7;flashC='255,40,40';shake=8;toast('RƠI ĐỒ ĐỎ: '+it.name,RAR[6].c);banner('ĐỒ ĐỎ!',it.name,RAR[6].c,2.2)}
  else if(t===5)toast('Rơi đồ Hồng: '+it.name,RAR[5].c);
  if(t>=2&&t<6)sfx('drop',t);
  return take(it);
}
function take(it){
  if(G.auto[it.t]){G.da+=SALV[it.t];prog('salv');log('Phân giải',it.name+' → +'+SALV[it.t]+' đá',RAR[it.t].c);return {it,gone:1}}
  addBag(it);log('Nhận',it.name,it.t>=3?RAR[it.t].c:null);return {it,gone:0};
}
// phân giải đồ đã khảm: trả linh thạch về kho
function unGem(it){for(const g of it.so||[])if(g){const [kk,l]=g.split(':');ltAdd(kk,+l)}}
function addBag(it){
  if(G.bag.length>=BAG_MAX){
    const low=G.bag.reduce((a,b)=>b.t<a.t?b:a);
    const out=low.t>=it.t?it:low;
    G.da+=SALV[out.t];prog('salv');unGem(out);
    if(out===it){toast('Túi đầy, đã phân giải '+it.name+' (+'+SALV[it.t]+' đá)');dirty=1;return}
    G.bag=G.bag.filter(x=>x!==low);
  }
  G.bag.push(it);dirty=1;
}
function heroDown(){
  burst(HX(),GY()-25*U(),20,'#ffffff',{sp:140});
  G.stage=Math.max(1,G.stage-1);G.kill=0;hero.hp=hero.max;spawn();
  toast('Bị hạ! Lùi về ải '+G.stage+'. Mặc đồ mạnh hơn hoặc cường hóa rồi đánh tiếp','#ff6b6b');log('Ải','Bị hạ, lùi về ải '+G.stage,'#ff8a80');dirty=1;
}
function heroHurt(d,c){
  hero.hp-=d;hero.hurt=.15;sfx('hurt');say(HX(),GY()-58*U(),'-'+nf(d),null,c?16:14,'hurt');
  burst(HX()+4*U(),GY()-26*U(),6,c||'#ff6b5b',{sp:110,k:'ln',g:0,up:0,life:.25});
}
function step(dt){
  clock+=dt;
  for(let i=0;i<3;i++)cds[i]=Math.max(0,cds[i]-dt);
  hero.war=Math.max(0,hero.war-dt);hero.shield=Math.max(0,hero.shield-dt);hero.hurt=Math.max(0,(hero.hurt||0)-dt);
  if(hero.atk>=0){hero.atk+=dt;if(hero.atk>.3)hero.atk=-1}
  for(const x of timers)x.t-=dt;
  const due=timers.filter(x=>x.t<=0);timers=timers.filter(x=>x.t>0);due.forEach(x=>x.fn());
  for(const v of vfx)v.t+=dt;vfx=vfx.filter(v=>v.t<v.life);
  hero.lunge=Math.max(0,hero.lunge-dt);mon.hit=Math.max(0,mon.hit-dt);mon.lunge=Math.max(0,(mon.lunge||0)-dt);
  flash=Math.max(0,flash-dt);shake=Math.max(0,shake-dt*40);
  mon.tr+=(Math.max(0,mon.hp/mon.max)-mon.tr)*Math.min(1,dt*2.5);
  for(const f of fx)f.t+=dt;
  if(fx.some(f=>f.t>=1.9))bump('#nav [data-open="tui"]');
  fx=fx.filter(f=>f.t<1.9);
  for(const s of texts)s.t+=dt;texts=texts.filter(s=>s.t<s.life);
  for(const b of banners)b.t+=dt;banners=banners.filter(b=>b.t<b.life);
  stepParts(dt);stepAmb(dt);
  const u=U();
  if(hero.war>0&&Math.random()<dt*28)parts.push({k:'flame',x:HX()+(Math.random()-.5)*20*u,y:GY()-Math.random()*10*u,vx:0,vy:-55*u/1.6,g:0,t:0,life:.6,s:3.2,c:Math.random()<.5?'#f6c64f':'#ff9a33'});
  if(!mon.dead&&mon.ty==='lua'&&Math.random()<dt*10){const [x,y]=monMid();parts.push({k:'flame',x:x+(Math.random()-.5)*16*u,y,vx:0,vy:-45*u/1.6,g:0,t:0,life:.5,s:2.6,c:'#ffb02a'})}
  if(mon.dead||mon.enter>0){hero.run=(hero.run??0)+dt*13;scroll+=dt*75*u/1.6}else hero.run=null;
  if(mon.dead){mon.dead+=dt;if(mon.dead>.45)spawn();return}
  if(mon.enter>0){mon.enter=Math.max(0,mon.enter-dt);return}
  if(fight){fight.t-=dt;
    if(fight.t<=0){if(fight.ty==='pvp'){const me=hero.hp/hero.max,op=mon.hp/mon.max;endFight(me>op,'Hết giờ: bạn còn '+Math.round(me*100)+'% máu, đối thủ còn '+Math.round(op*100)+'%.')}
      else endFight(false);return}}
  if(mon.pvp){mon.war=Math.max(0,mon.war-dt);mon.shield=Math.max(0,mon.shield-dt);
    // đối thủ cũng dùng 3 kỹ năng của lớp mình
    if(mon.stun<=0)for(const s of mon.sk){s.t-=dt;if(s.t<=0){s.t=s.cd;say(monX(),barY()-30*u,s.n,CLS[mon.cls].c,16,'name');mon.lunge=.22;
      if(s.k==='het')mon.war=6;else if(s.k==='bang')mon.shield=5;
      else{const d=Math.max(1,Math.round(mon.atk*EM[s.k]/PVP_HP*100/(100+S.def*(hero.war>0?1.3:1))*(1-S.dr/100)*(hero.shield>0?.5:1)*(mon.war>0?1.4:1)));
        heroHurt(d,CLS[mon.cls].c);vfx.push({ty:'ehit',t:0,life:.35,c:CLS[mon.cls].c});shake=Math.max(shake,5);
        if(s.k==='tram')hero.cd+=1}
      break}}
    if(hero.hp<=0){endFight(false,'Bạn bị hạ.');return}}
  if(G.autoSk)for(let i=2;i>=0;i--)if(cds[i]<=0){cast(i);break}
  if(mon.burn>0){mon.burn-=dt;mon.bt+=dt;if(Math.random()<dt*14){const [x,y]=monMid();parts.push({k:'flame',x:x+(Math.random()-.5)*18*u,y:y+6*u,vx:0,vy:-50*u/1.6,g:0,t:0,life:.5,s:3,c:'#ff9a33'})}
    if(mon.bt>=1){mon.bt-=1;hit(.3,{nocrit:1,c:'#ffa64d'})}}
  if(mon.dead)return;
  hero.cd-=dt;
  if(hero.cd<=0){hero.cd=1/Math.max(.3,1+S.spd/100);hero.atk=0;
    if(G.cls==='cb'){hero.lunge=.2;later(.09,()=>{vfx.push({ty:'swing',t:0,life:.2});hit(1,{basic:1})})}
    else later(.06,()=>{shoot();later(.16,()=>hit(1,{basic:1}))});
    if(S.dbl&&Math.random()*100<S.dbl)later(.24,()=>{if(G.cls==='cb'){vfx.push({ty:'swing',t:0,life:.2});hit(1,{basic:1})}else{shoot();later(.16,()=>hit(1,{basic:1}))}})}
  const P=petAct();
  if(P){hero.pcd=(hero.pcd??1.5)-dt;if(hero.pcd<=0){hero.pcd=2.4;hero.pj=.3;const [px,py]=petPos(),[tx,ty]=monMid();
    vfx.push({ty:'proj',k:'magic',t:0,life:.2,x:px,y:py,tx,tY:ty,c:P.c});later(.2,()=>hit(petMult(G.pet.own[P.k]),{pet:1,c:P.c}))}}
  if(mon.dead)return;
  if(mon.stun>0)mon.stun-=dt;else hero.mcd-=dt*(hero.shield>0?.6:1);
  if(hero.mcd<=0){hero.mcd=mon.aspd||1.6;mon.lunge=.22;
    let d=mon.atk*100/(100+S.def*(hero.war>0?1.3:1))*(1-S.dr/100)*(hero.shield>0?.5:1);
    if(mon.pvp){d*=(mon.war>0?1.4:1)/PVP_HP;if(Math.random()*100<mon.crit)d*=1.6}
    heroHurt(Math.max(1,Math.round(d)));
    if(hero.hp<=0){if(fight)endFight(false,'Bạn bị hạ.');else heroDown()}}
}

/* ---------- hạt, đồng xu, chữ bay, dải chữ ---------- */
function burst(x,y,n,c,o={}){
  const k=U()/1.6;
  for(let i=0;i<n&&parts.length<300;i++){const a=Math.random()*Math.PI*2,sp=(o.sp||140)*(.35+Math.random()*.75)*k;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(o.up??60)*k,g:(o.g??380)*k,t:0,life:(o.life||.55)*(.6+Math.random()*.7),s:(o.s||2.6)*(.6+Math.random()*.8),c,k:o.k||'sq'})}
}
function relPos(sel,dx=0,dy=0){const e=document.querySelector(sel);if(!e)return [W/2,-20];const r=e.getBoundingClientRect(),c=cv.getBoundingClientRect();return [r.left+r.width/2-c.left+dx,r.top+r.height/2-c.top+dy]}
function coins(x,y,n){const [tx,ty]=relPos('.pill.g',-30);
  for(let i=0;i<n;i++)parts.push({k:'coin',x,y,vx:(Math.random()-.5)*170,vy:-140-Math.random()*130,g:620,t:0,fly:.45+i*.04,life:.45+i*.04+.5,tx,ty,s:4.6})}
let bumpT={};
function bump(sel){const e=document.querySelector(sel);if(!e||performance.now()-(bumpT[sel]||0)<250)return;bumpT[sel]=performance.now();e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump')}
function stepParts(dt){
  const gy=GY();let got=0;
  for(const p of parts){p.t+=dt;
    if(p.k==='coin'&&p.t>=p.fly){if(p.sx==null){p.sx=p.x;p.sy=p.y}const k=Math.min(1,(p.t-p.fly)/(p.life-p.fly)),e=k*k;
      p.x=p.sx+(p.tx-p.sx)*e;p.y=p.sy+(p.ty-p.sy)*e-Math.sin(k*Math.PI)*50;continue}
    p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.k==='coin'&&p.y>gy-3){p.y=gy-3;p.vy*=-.42;p.vx*=.6}
    if(p.k==='smoke'){p.vx*=.94;p.vy*=.94}
  }
  parts=parts.filter(p=>{if(p.t<p.life)return true;if(p.k==='coin')got=1;return false});
  if(got){bump('.pill.g');sfx('coin')}
}
const AMB=['leaf','leaf','fly','drip','ember','mote','soul'];
function stepAmb(dt){
  const k=AMB[curReg()],run=mon.dead||mon.enter>0,sp=run?75*U()/1.6:0;
  if(amb.length&&amb[0].k!==k)amb=[];
  if(amb.length<18&&Math.random()<dt*7)amb.push(newAmb(k));
  for(const a of amb){a.t+=dt;a.x+=(a.vx-sp*.8)*dt+(a.k==='leaf'?Math.sin(a.t*2+a.p)*22*dt:0);a.y+=a.vy*dt}
  amb=amb.filter(a=>a.t<a.life&&a.x>-30&&a.x<W+40&&a.y<H+10&&a.y>-30);
}
function newAmb(k){const gy=GY(),r=Math.random,p=r()*6;
  if(k==='leaf')return {k,x:r()*W*1.3,y:-8,vx:-15-r()*15,vy:22+r()*18,t:0,life:14,p,c:r()<.5?'#79c14a':'#d8d84a'};
  if(k==='fly')return {k,x:r()*W,y:gy*(.35+r()*.6),vx:(r()-.5)*16,vy:(r()-.5)*10,t:0,life:4+r()*3,p,c:'#e8ff8a'};
  if(k==='drip')return {k,x:r()*W,y:-4,vx:0,vy:90+r()*60,t:0,life:6,p,c:'#9fd8ff'};
  if(k==='ember')return {k,x:r()*W*1.2,y:gy+r()*12,vx:-6+r()*10,vy:-25-r()*35,t:0,life:5,p,c:r()<.5?'#ff9a33':'#ffd04a'};
  if(k==='mote')return {k,x:r()*W*1.2,y:r()*gy,vx:-8+r()*5,vy:-3+r()*6,t:0,life:6,p,c:'#fff0b0'};
  return {k,x:r()*W*1.2,y:gy+r()*12,vx:(r()-.5)*8,vy:-12-r()*16,t:0,life:6,p,c:'#d08aff'};

/* ---------- bảng món đồ ---------- */
let open=null;
function showItem(it,where){
  open={it,where};
  const r=RAR[it.t],ms=ST[SLOTS[it.si].main],p=it.plus||0;
  let h=`<div class="top2">${cell(it,'tabindex="-1"')}<div><h3>${p?`<em>+${p}</em> `:''}${it.name}</h3><div class="meta">Bậc ${r.n} · ${SLOTS[it.si].n} · Cấp ${it.lvl}</div></div></div>`;
  h+=`<div class="mainst">+${fmt(mainVal(it),ms.p)} ${ms.n}<span>chỉ số chính${p?' (cường hóa +'+p*10+'%)':''}</span></div><ul class="aff">`;
  h+=it.aff.length?it.aff.map(([kk,v,hi])=>`<li class="${hi?'hi':''}">+${fmt(v,ST[kk].p)} ${ST[kk].n}${hi?' · gần tối đa':''}</li>`).join(''):'<li class="none">Đồ Trắng không có dòng phụ</li>';
  h+='</ul>';
  if(nSock(it.t)){const so=sockOf(it);h+=`<div class="box"><h4>Ô khảm ${so.filter(Boolean).length}/${so.length}</h4>${so.map(g=>{if(!g)return '<p>Ô trống · khảm ở Lò rèn → Khảm</p>';
    const [kk,l]=g.split(':');return `<p class="on">${ltName(kk,+l)}: +${fmt(ltVal(kk,+l),ST[LT[kk].st].p)} ${ST[LT[kk].st].n}</p>`}).join('')}</div>`}
  if(it.sk){const st=SETS[it.sk],have=S.sets[it.sk]||0;
    h+=`<div class="box set"><h4>Bộ ${st.n} · đang mặc ${have}/6</h4>${st.b.map(([n,t])=>`<p class="${have>=n?'on':''}">${n} món: ${t}</p>`).join('')}</div>`}
  let enhBtn='<span></span>';
  if(p<ENH_MAX){const c=enhCost(it),ok=G.da>=c.da&&G.gold>=c.gold;
    h+=`<div class="box"><h4>Cường hóa +${p} → +${p+1} · ${enhRate(p)}% thành công</h4><p>Cần ${c.da} đá (có ${nf(G.da)}) và ${nf(c.gold)} vàng (có ${nf(G.gold)}). Hỏng thì giữ nguyên +${p}.</p></div>`;
    enhBtn=`<button class="btn orange" data-act="enh" ${ok?'':'disabled'}>Cường hóa</button>`}
  if(where==='bag'){
    const eq2=G.eq.slice();eq2[it.si]=it;const np=calc(eq2).power,dd=np-S.power,cur=G.eq[it.si];
    // so từng chỉ số với món đang mặc cùng ô: mũi tên xanh là món này hơn, đỏ là kém hơn
    const sto=x=>{const m={};if(!x)return m;m[SLOTS[x.si].main]=mainVal(x);for(const [kk,v] of x.aff)m[kk]=(m[kk]||0)+v;return m};

// cảnh màn mở đầu: 3 người que mặc đồ Đỏ, 7 viên ngọc bậc màu bay quanh, người được chọn đứng giữa to hơn
function introLoop(ts){
  if(!introOn)return;
  const c=$('introcv'),r=c.getBoundingClientRect(),dp=Math.min(2,window.devicePixelRatio||1);
  if(c.width!==Math.round(r.width*dp)||c.height!==Math.round(r.height*dp)){c.width=Math.round(r.width*dp);c.height=Math.round(r.height*dp)}
  clock+=1/60;
  const old=ctx;ctx=c.getContext('2d');ctx.setTransform(dp,0,0,dp,0,0);
  try{
    const w=r.width,h=r.height,gy=h*(introStep===2?.52:.6),u=Math.min(w/96,h/150);
    const sk=ctx.createLinearGradient(0,0,0,gy);sk.addColorStop(0,'#1a0f33');sk.addColorStop(.6,'#5a2a6a');sk.addColorStop(1,'#f08a5a');ctx.fillStyle=sk;ctx.fillRect(0,0,w,gy);
    ctx.fillStyle='#fff';for(let i=0;i<40;i++){const x=(i*97.3)%w,y=(i*53.7)%(gy*.6);ctx.globalAlpha=.4+.4*Math.sin(clock*2+i);ctx.fillRect(x,y,2,2)}ctx.globalAlpha=1;
    ctx.fillStyle='#ffd08a';ctx.beginPath();ctx.arc(w*.5,gy-4*u,26*u,Math.PI,0);ctx.fill();
    for(const [k,col] of [[.6,'#3a1a44'],[.35,'#2a1430']]){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,gy);for(let x=0;x<=w;x+=6){ctx.lineTo(x,gy-k*30*u*(1+Math.sin(x/w*7+k*9))*.6)}ctx.lineTo(w,gy);ctx.fill()}
    ctx.fillStyle='#3a2414';ctx.fillRect(0,gy,w,h-gy);ctx.fillStyle='#5c9e2e';ctx.fillRect(0,gy,w,4*u);ctx.fillStyle='#79c14a';ctx.fillRect(0,gy,w,1.5*u);
    const cx=w/2,cy=gy-26*u;
    const orb=(i,front)=>{const a=clock*.8+i/7*Math.PI*2,z=Math.sin(a);if(front!==(z>0))return;const x=cx+Math.cos(a)*34*u,y=cy+z*7*u-8*u,s=(3.6+z*.8)*u,col=RAR[i].c;
      ctx.save();ctx.shadowColor=col;ctx.shadowBlur=14;const g=ctx.createRadialGradient(x-s*.3,y-s*.3,1,x,y,s);g.addColorStop(0,'#fff');g.addColorStop(.4,col);g.addColorStop(1,sh(col,-.4));
      ctx.beginPath();ctx.arc(x,y,s,0,7);ctx.fillStyle=g;ctx.fill();ctx.restore()};
    for(let i=0;i<7;i++)orb(i,false);
    const ks=['ct','cb','ps'],sel=introStep===2?introPick:'cb';
    ks.sort((a,b2)=>(a===sel)-(b2===sel));
    const pos={};let side=0;for(const k of ks)pos[k]=k===sel?0:(side++?1:-1);
    for(const k of ks){const big=k===sel,t=(clock*.7+(pos[k]+1)*.6)%2.2;
      stick(cx+pos[k]*24*u,gy,big?u*1.25:u*.85,{cls:k,dir:1,hatC:'#e8322f',capeC:'#e8322f',gloveC:'#f0559e',bootC:'#f08a1c',wpnC:'#e8322f',wpnT:6,atk:t<.5?t:-1,ph:pos[k]})}
    for(let i=0;i<7;i++)orb(i,true);
  }finally{ctx=old}
  requestAnimationFrame(introLoop);
}

let tutN=0;
function tutEv(ev){
  if(!G||!(G.tut>=0))return;const s=TUT[G.tut];if(!s||s.ev!==ev)return;

function tutPos(){
  const on=G&&G.tut>=0&&G.tut<TUT.length&&!introOn&&!fight;$('tut').hidden=!on;if(!on)return;
  const s=TUT[G.tut];let sel=s.sel,txt=s.t;

  if(open&&s.ev!=='closesheet'){sel='#pane [data-act="close"]';txt='Bấm <b>Đóng</b> trước.'}
  let rc=null;
  if(sel==='mon'){if(mon&&!mon.dead){const c=cv.getBoundingClientRect(),[x,y]=monMid(),u=U();rc={left:c.left+x-16*u,top:c.top+y-18*u,width:32*u,height:36*u}}}
  else if(sel){const e=document.querySelector(sel);if(e){const r=e.getBoundingClientRect();if(r.width)rc=r}}
  const R=$('tutR'),Hd=$('tutH'),B=$('tutB');
  if($('tutT').innerHTML!==txt)$('tutT').innerHTML=txt;
  $('tutSkip').hidden=s.ev==='end';$('tutDone').hidden=s.ev!=='end';
  R.hidden=Hd.hidden=!rc;
  if(!rc){B.style.top='40%';return}
  const p=5;Object.assign(R.style,{left:rc.left-p+'px',top:rc.top-p+'px',width:rc.width+2*p+'px',height:rc.height+2*p+'px'});
  Object.assign(Hd.style,{left:rc.left+rc.width/2-8+'px',top:rc.top+rc.height*.55+'px'});
  const below=rc.top+rc.height/2<innerHeight*.5;
  B.style.top=(below?Math.min(innerHeight-90,rc.top+rc.height+52):Math.max(8,rc.top-B.offsetHeight-16))+'px';
}

function exportCode(){try{return 'NQSD1:'+btoa(unescape(encodeURIComponent(JSON.stringify(G))))}catch(e){return ''}}
function importCode(s){s=(s||'').trim();if(!s.startsWith('NQSD1:'))return null;try{const g=JSON.parse(decodeURIComponent(escape(atob(s.slice(6)))));return g&&Array.isArray(g.eq)?g:null}catch(e){return null}}
let wipeArm=0,noSave=0;

function pray(n){
  const cost=n*10;
  if(G.gem<cost)return toast('Chưa đủ ngọc: cần '+cost+', đang có '+nf(G.gem),'#ff6b6b');
  G.gem-=cost;sfx('pray');
  const tiers=[];
  for(let i=0;i<n;i++){
    G.pity++;let t=G.pity>=PITY?6:rollTier(PRAY_W);
    if(n===10&&i===9&&!tiers.some(x=>x>=3)&&t<3)t=rollTier([0,0,0,14,6.5,2.5,1]);
    if(t===6)G.pity=0;
    tiers.push(t);
  }
  const res=tiers.map((t,i)=>drop(t,W*(.3+.4*(i/Math.max(1,n-1)))));
  prog('pray',n);refresh();dirty=1;save();showResults(res);tutEv('pray');
}
function enhance(it){
  const c=enhCost(it);
  if(G.da<c.da||G.gold<c.gold)return toast('Chưa đủ nguyên liệu: cần '+c.da+' đá và '+nf(c.gold)+' vàng','#ff6b6b');
  G.da-=c.da;G.gold-=c.gold;prog('enh');tutEv('enh');
  if(Math.random()*100<enhRate(it.plus||0)){it.plus=(it.plus||0)+1;sfx('ok');toast('Cường hóa thành công: '+fullName(it),'#f6c64f');log('Lò rèn','Thành công '+fullName(it),'#ffd34d');if(it.plus>=10)flash=.4}
  else{sfx('bad');toast('Cường hóa hỏng, giữ nguyên +'+(it.plus||0),'#ff6b6b');log('Lò rèn','Hỏng, giữ +'+(it.plus||0)+' '+it.name,'#ff8a80')}
  refresh();dirty=1;save();
}
function setCls(k,first){

}
function autoEquip(){
  const pool=G.bag.concat(G.eq.filter(Boolean));let eq=G.eq.slice(),best=calc(eq).power;
  for(let pass=0;pass<2;pass++)for(let si=0;si<6;si++)for(const c of pool){if(c.si!==si||eq[si]===c)continue;
    const e2=eq.slice();e2[si]=c;const p=calc(e2).power;if(p>best){best=p;eq=e2}}
  const gain=best-S.power;G.eq=eq;G.bag=pool.filter(x=>!eq.includes(x));refresh();dirty=1;save();
  tutEv('auto');
  toast(gain>0?'Đã mặc đồ mạnh nhất: lực chiến +'+nf(gain):'Đồ đang mặc đã là mạnh nhất');
}
function salvJunk(){
  const junk=G.bag.filter(x=>x.t<=2&&!x.plus);if(!junk.length)return toast('Không có đồ Trắng, Lục, Xanh chưa cường hóa để phân giải');

  if(ds.ach){const a=ACH.find(x=>x.k===ds.ach),l=achLv(a);if(l>=a.lv.length||achVal(a)<a.lv[l])return;G.ach[a.k]=l+1;G.gem+=achGem(l);sfx('lvup');dirty=1;save();return toast('Thành tựu '+a.n+' '+(l+1)+' sao: +'+achGem(l)+' ngọc','#8fe3ff')}
  if(ds.mapch){const j=+ds.mapch,ab=Math.floor((Math.floor((G.best-1)/70)*70)/10)+mapReg,c=G.mapCh[ab]=G.mapCh[ab]||[];if(c.includes(j))return;c.push(j);const t=give(STAR_CH[j][1]);sfx('ok');dirty=1;save();return toast('Rương sao: '+t,'#f6c64f')}
  if(ds.set){G.set[ds.set]=G.set[ds.set]?0:1;audioOn();vol();save();return renderWin()}
  if(ds.spd){G.set.spd=+ds.spd;save();return renderWin()}
  switch(ds.act){
    case 'mq':{const q=MQ[G.mq];if(!q)return;if(q.v()>=q.need){const t=give(q.r);G.mq++;sfx('ok');dirty=1;save();return toast('Nhiệm vụ chính xong: '+t,'#9be36a')}
      if(q.go)return openWin(q.go);return toast('Cứ để nhân vật đánh quái ở màn chính là xong')}
    case 'sign':{if(!canSign())return;const t=give(SIGN[G.sign.n%30]);G.sign.n++;G.sign.last=today();prog('sign');sfx('lvup');dirty=1;save();return toast('Điểm danh: '+t,'#f6c64f')}
    case 'thap':closeSheet();return startThap();
    case 'shopref':{const c=shopRef();if(G.gem<c)return;G.gem-=c;const r=G.shop.ref+1;shopRoll();G.shop.ref=r;dirty=1;save();return renderWin()}
    case 'intronext':G.name=$('inName').value.trim().slice(0,14)||NAME_GOI[0];introStep=2;return renderIntro();
    case 'introstart':case 'introgo':return introDone();
    case 'tutskip':G.tut=-1;save();return tutPos();
    case 'tutdone':G.tut=-1;G.gem+=200;sfx('lvup');toast('Nhận 200 ngọc. Chúc săn được đồ Đỏ!','#8fe3ff');dirty=1;save();return tutPos();
    case 'rename':{const v=$('nmIn').value.trim().slice(0,14);if(!v)return toast('Tên không được để trống','#ff6b6b');G.name=v;save();dirty=1;return toast('Đã đổi tên thành '+v)}
    case 'copycode':{const t=$('codeOut');t.select();
      const ok=()=>toast('Đã chép mã. Dán gửi cho chính mình để giữ'),no=()=>{try{document.execCommand('copy');ok()}catch(_){toast('Không chép tự động được: nhấn giữ vào ô mã để chép','#ff6b6b')}};
      if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(ok,no);else no();return}
    case 'loadcode':{const g=importCode($('codeIn').value);if(!g)return toast('Mã không đúng, kiểm tra lại đã dán đủ chưa','#ff6b6b');
      noSave=1;try{localStorage.setItem(KEY,JSON.stringify(g))}catch(_){}toast('Nạp mã xong, đang mở lại game…');return setTimeout(()=>location.reload(),600)}
    case 'wipe':if(!wipeArm){wipeArm=1;return renderWin()}
      noSave=1;try{localStorage.removeItem(KEY);localStorage.removeItem(KEY+'_bak')}catch(_){}return location.reload();
  }
  if(ds.open){if(open)closeSheet();return openWin(ds.open)}
  if(ds.trum)return startTrum(+ds.trum);
  if(ds.pvp)return startPvp(+ds.pvp);
  if(ds.soon)return toast('Sắp có · '+ds.soon,'#9aa0b0');
  if(ds.go!=null){if(ds.go)openWin(ds.go);else{closeWin();toast('Đánh quái ở màn chính để hoàn thành')}return}
  if(ds.rsel){renSel=+ds.rsel;return renderWin()}
  if(ds.sk){const i=+ds.sk;if(!cast(i))toast(cds[i]>0?cls().sk[i].n+' đang hồi, còn '+cds[i].toFixed(1)+' giây':'Chờ quái mới xuất hiện','#9aa0b0');return}
  if(ds.autosk){G.autoSk=!G.autoSk;renderSkills();dirty=1;save();return toast(G.autoSk?'Kỹ năng tự dùng khi hồi xong':'Đã tắt tự động: bấm nút kỹ năng để dùng')}
  if(ds.cls){if(ds.cls!==G.cls)setCls(ds.cls);return}
  if(ds.auto){const i=+ds.auto;G.auto[i]=!G.auto[i];dirty=1;save();
    return toast(G.auto[i]?'Đồ '+RAR[i].n+' rơi ra sẽ tự phân giải thành đá':'Đã tắt tự phân giải đồ '+RAR[i].n,RAR[i].c)}
  if(ds.q){const i=+ds.q,d=daily();if(d.got.includes(i))return;d.got.push(i);const s=give(QUESTS[i].r);dirty=1;save();return toast('Nhận '+s+' và 20 điểm năng động')}
  if(ds.chest){const i=+ds.chest,d=daily();if(d.chest.includes(i))return;d.chest.push(i);const s=give(CHESTS[i][1]);dirty=1;save();return toast('Mở rương '+CHESTS[i][0]+' điểm: '+s,'#f6c64f')}
  if(ds.bag){const it=G.bag.find(x=>x.id==ds.bag);if(it)showItem(it,'bag');return}
  if(ds.eq){showItem(G.eq[+ds.eq],'eq');return}
  const act=ds.act,it=open&&open.it;
  if(act==='closewin')return closeWin();
  if(act==='leave'){if(fight)endFight(false,'Bạn đã rời trận.');return}
  if(act==='reopp'){G.arena.opp=makeOpp();save();return renderWin()}
  if(act==='close')return closeSheet();
  if(act==='pray1')return pray(1);
  if(act==='pray10')return pray(10);
  if(act==='again')return pray(open.res.length);
  if(act==='auto')return autoEquip();
  if(act==='salvjunk')return salvJunk();
  if(act==='enhsel')return enhance(G.eq[renSel]);
  if(act==='enh'){enhance(it);return showItem(it,open.where)}
  if(act==='wear'){const old=G.eq[it.si];G.eq[it.si]=it;G.bag=G.bag.filter(x=>x!==it);if(old)G.bag.push(old);toast('Đã mặc '+fullName(it),RAR[it.t].c)}
  if(act==='salv'){unGem(it);G.bag=G.bag.filter(x=>x!==it);G.da+=SALV[it.t];prog('salv');toast('Đã phân giải '+fullName(it)+' (+'+SALV[it.t]+' đá)')}
  if(act==='off'){if(G.bag.length>=BAG_MAX)return toast('Túi đầy, phân giải bớt đồ rồi tháo','#ff6b6b');G.eq[it.si]=null;G.bag.push(it);toast('Đã tháo '+fullName(it))}
  closeSheet();refresh();dirty=1;save();
});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(open)closeSheet();else if(winKey)closeWin()});
let tt;
function toast(s,c){const t=$('toast');t.textContent=s;t.style.setProperty('--tc',c||'#f6c64f');t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2400)}

/* ---------- lưu và khởi động ---------- */
const KEY='nqsd_v1';
// noSave: đang nạp mã / xóa dữ liệu rồi tải lại trang, không ghi đè bản vừa nạp
function save(){if(noSave||!G)return;G.lastSeen=Date.now();try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}}
// bản sao phòng hỏng: mỗi phút chép thêm một bản, bản chính đọc lỗi thì dùng bản này
setInterval(()=>{if(G&&!noSave)try{localStorage.setItem(KEY+'_bak',JSON.stringify(G))}catch(e){}},60000);
// quay lại game sau khi để ẩn (chuyển ứng dụng, tắt màn hình) cũng tính thưởng treo máy
document.addEventListener('visibilitychange',()=>{if(!G)return;if(document.hidden)save();else if(!fight&&!open&&!introOn)offline()});
function seed(){
  G={stage:1,kill:0,gold:1500,gem:500,da:30,pity:0,auto:[true,true,false,false,false,false,false],eq:[null,null,null,null,null,null],bag:[],uid:0};
  G.eq[0]=makeItem(0,1,0);G.eq[2]=makeItem(1,1,2);
  [[2,1],[3,3],[4,4],[5,5],[6,0,'long'],[6,2,'long'],[6,1,'quy'],[0,3],[1,4]].forEach(([t,si,sk])=>G.bag.push(makeItem(t,1,si,sk)));
}
function start(data){
  if(data&&data.G)G=data.G;
  else for(const k of [KEY,KEY+'_bak']){try{const s=localStorage.getItem(k);if(s){const g=JSON.parse(s);if(g&&Array.isArray(g.eq)){G=g;break}}}catch(e){}}
  if(!G||!Array.isArray(G.eq))seed();
  // bản lưu cũ thì thêm phần còn thiếu
  if(G.gem==null)G.gem=500; if(G.da==null)G.da=30; if(G.pity==null)G.pity=0;
  if(!Array.isArray(G.auto))G.auto=[true,true,false,false,false,false,false];
  if(G.autoSk==null)G.autoSk=true;
  if(!G.lv){G.lv=1;G.exp=0}
  if(!G.arena)G.arena={rank:1000,win:0,lose:0,opp:[]};
  if(!G.set)G.set={mus:1,sfx:1,vib:1,spd:1};
  if(!G.tot)G.tot={};if(!G.ach)G.ach={};if(G.mq==null)G.mq=0;if(!G.sign)G.sign={n:0,last:''};
  if(!G.stars)G.stars={};if(!G.mapCh)G.mapCh={};if(!G.best)G.best=G.stage;if(G.tower==null)G.tower=0;if(!G.wb)G.wb=[];
  if(!G.lt)G.lt={};if(!G.rel)G.rel={};if(G.relU==null)G.relU=0;if(!G.pet)G.pet={own:{cho:1},act:'cho'};if(!G.skin)G.skin={cape:null,aura:null};
  const chua=!G.cls;if(chua)G.cls='cb';
  if(G.tut==null)G.tut=chua?0:-1;
  daily();week();refresh();
  renderFrame();renderSkills();resize();spawn();renderTop();
  log('Hệ thống','Chào mừng đến Người Que Săn Đồ','#ffd34d');
  requestAnimationFrame(frame);
  setInterval(tickSkills,100);
  setInterval(()=>{if(!document.hidden)save();if(G.daily.date!==today())dirty=1},5000);
  showIntro(chua);
}
// chỉ để script chạy thử bấm nhanh các phần mới
window.__thu=k=>{
  if(k==='afk'){closeSheet();G.lastSeen=Date.now()-3*3600e3;offline()}
  if(k==='trum'){closeSheet();daily().trum=0;startTrum(0)}
  if(k==='dau'){closeSheet();openWin('dau')}
  if(k==='pvp'){closeSheet();daily().pvp=0;startPvp(0)}
  if(k==='lv'){closeSheet();closeWin();gainExp(800)}
  // v3 = sang vùng thứ 4 (ải 31), b3 = trùm ải ở vùng đó
  if(k[0]==='v'||k[0]==='b'){closeSheet();closeWin();if(fight)endFight(false);G.stage=+k.slice(1)*10+1;G.kill=k[0]==='b'?4:0;G.best=Math.max(G.best,G.stage);spawn()}
  // chua = Chúa Vùng ải 10; thap = leo tháp; wb = đánh trùm thế giới đầu (bỏ qua lực chiến); map/diem/phieu/tt = mở cửa sổ
  if(k==='chua'){closeSheet();closeWin();G.stage=10;G.kill=4;spawn()}
  if(k==='thap'){closeSheet();closeWin();G.tower=4;startThap()}
  if(k==='wb'){closeSheet();closeWin();if(fight)endFight(false);closeSheet();WB[0].cp=0;startWb(0)}
  if(['map','diem','phieu','wbw'].includes(k)){closeSheet();if(fight)endFight(false);closeSheet();openWin(k==='wbw'?'wb':k)}
  if(k==='giau'){G.gem+=5000;G.gold+=1e6;G.da+=2000;G.relU=60;G.best=Math.max(G.best,45);G.tower=Math.max(G.tower,12);G.tot.sign=8;G.tot.wb=1;
    for(const kk of Object.keys(LT))ltAdd(kk,1,7);for(let i=0;i<4;i++)addBag(makeItem(6,20));refresh();dirty=1}
  if(k.startsWith('w_')){closeSheet();if(fight)endFight(false);closeSheet();const w=k.slice(2);if(w==='kham'||w==='tay'){autoEquip();renTab=w;renSel=0;openWin('ren')}else openWin(w)}
  if(k==='tt'){closeSheet();G.tot.kill=150;nhvTab='tt';openWin('nhv')}
};
window.addEventListener('resize',resize);
window.claude?.hot?.snapshot?.(()=>({G}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
